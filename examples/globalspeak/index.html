<!doctype html>
<html><head><meta charset="utf-8">
<title>GlobalSpeak — 60s product film</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=block" rel="stylesheet">
<script src="../../engine/motion.js"></script>
<style>
:root{--navy:#1A2540;--navy2:#243155;--blue:#1E4DD8;--blue2:#3B6BEE;--red:#D32F2F;--cream:#FBF8F0;--cream2:#FAF6EC;--gold:#DECB95;--border:#ECE5D5;--muted:#5F6675;--green:#1F9D55}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--cream)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Geist,system-ui,sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;display:none}
.cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.a{position:absolute}
.card{position:absolute;background:#fff;border-radius:24px;box-shadow:0 30px 80px rgba(26,37,64,.12),0 0 0 1px rgba(26,37,64,.05);overflow:hidden}
.roll{position:absolute;overflow:hidden}
.roll>div{white-space:nowrap}
.disp{font-weight:700;letter-spacing:-.035em;line-height:1.04}
.mask{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
.mask>span{display:inline-block}
.chip{position:absolute;border:1.5px solid var(--border);border-radius:16px;background:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;font-size:20px;font-weight:600}
.chip i{width:38px;height:38px;border-radius:11px;display:block;flex:none}
.chip small{margin-left:auto;font-size:14px;color:var(--muted);font-weight:500}
.cell{position:absolute;border-radius:10px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
.pill{position:absolute;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:999px;font-weight:600;white-space:nowrap}
.win-bar{position:absolute;left:0;top:0;right:0;height:44px;background:#F3F1EC;border-bottom:1px solid #E4DFD3}
.dot{position:absolute;top:16px;width:12px;height:12px;border-radius:50%}
#cursor{position:absolute;left:0;top:0;width:46px;height:46px;z-index:1000;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3));transform-origin:9px 5px}
</style></head><body>
<div id="stage"></div>
<svg id="cursor" viewBox="0 0 26 26"><path d="M5 2.5v18.2l4.6-4.4 3 6.8 3.2-1.4-3-6.7h6.4z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
<script>
/* ============ GlobalSpeak — 60 s product film. Brand tokens read from app/globals.css ============ */
const BPM = 113.336, B = VP.clock(BPM), W = 1920, H = 1080;
const { sp, track, ramp, clamp, lerp, ease, eOut, SPR, place, roll, scaleRect } = VP;
const $ = s => document.querySelector(s), stage = $('#stage');
const IMG = { home: 'assets/home.png', bookings: 'assets/bookings.png', admin: 'assets/admin-dashboard.png' };
const LOGO = (id) => `<svg id="${id}" viewBox="0 0 200 200" width="200" height="200" style="position:absolute;overflow:visible">
 <defs><path id="${id}t" d="M 30,100 A 70,70 0 0 1 170,100" fill="none"/><path id="${id}b" d="M 30,100 A 70,70 0 0 0 170,100" fill="none"/></defs>
 <circle class="ring1" cx="100" cy="100" r="96" fill="#fff" stroke="#1A2540" stroke-width="3" pathLength="1" stroke-dasharray="1" />
 <circle class="ring2" cx="100" cy="100" r="88" fill="none" stroke="#1A2540" stroke-width="1.5" pathLength="1" stroke-dasharray="1"/>
 <circle class="rd" cx="14" cy="100" r="3" fill="#D32F2F"/><circle class="rd" cx="186" cy="100" r="3" fill="#D32F2F"/>
 <g class="arc"><text fill="#1A2540" font-family="Geist" font-weight="700" font-size="14" letter-spacing="2"><textPath href="#${id}t" startOffset="50%" text-anchor="middle">GLOBALSPEAK</textPath></text>
 <text fill="#1A2540" font-family="Geist" font-weight="700" font-size="11" letter-spacing="3"><textPath href="#${id}b" startOffset="50%" text-anchor="middle">ACADEMY</textPath></text></g>
 <g transform="translate(100,92)"><g class="globe"><circle r="30" fill="#1E4DD8"/><g class="grid" fill="none" stroke="#fff" stroke-width="1.3"><ellipse rx="30" ry="12" pathLength="1" stroke-dasharray="1"/><ellipse rx="15" ry="30" pathLength="1" stroke-dasharray="1"/><line x1="-30" x2="30" pathLength="1" stroke-dasharray="1"/><line y1="-30" y2="30" pathLength="1" stroke-dasharray="1"/></g></g></g>
 <g transform="translate(100,130)"><g class="bookL"><path d="M -28,-2 L 0,2 L 0,18 L -28,12 Z" fill="#1A2540"/></g><g class="bookR"><path d="M 28,-2 L 0,2 L 0,18 L 28,12 Z" fill="#D32F2F"/></g></g></svg>`;
const words = (t, cls = '') => t.split(' ').map(w => `<span class="mask"><span class="${cls}">${w}</span></span>`).join(' ');
const R = (x, y, w, h, r) => [x, y, w, h, r];
function el(parent, html) { parent.insertAdjacentHTML('beforeend', html); return parent.lastElementChild; }
function rollBox(parent, x, y, w, h, text, style = '') { return el(parent, `<div class="roll" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${style}"><div style="height:${h}px;line-height:${h}px">${text}</div></div>`); }
const rollK = (e, bin, bout) => { if (!e) return; const k = sp(bin, ...SPR.SNAP) + (bout ? sp(bout, ...SPR.SNAP) : 0); roll(e.firstElementChild, k, e.offsetHeight); };
const popK = (e, b0, preset = SPR.POP, origin = '50% 50%') => { const k = sp(b0, ...preset); e.style.transformOrigin = origin; e.style.transform = `scale(${Math.max(0, k)})`; e.style.visibility = k > .002 ? 'visible' : 'hidden'; return k; };
const count = (e, b0, b1, to, fmt = v => Math.round(v)) => { e.textContent = fmt(to * VP.eOutQuint(ramp(b0, b1, x => x))); };

/* ============ scenes ============ */
const S = [];
function scene(id, start, end, bg, inT, build, anim) { const root = el(stage, `<div class="scene" id="${id}" style="background:${bg};z-index:${S.length + 1}"><div class="cam"></div><div class="hud" style="position:absolute;inset:0;pointer-events:none"></div></div>`); const s = { id, start, end, bg, in: inT, root, cam: root.firstElementChild, hud: root.lastElementChild, anim }; build(s.cam, s); S.push(s); return s; }

/* 1 · OPEN — logo draws itself, tagline, globe zoom-through (0–10) */
scene('open', 0, 10.2, 'var(--cream)', 'none', (c, s) => {
  s.logo = el(c, `<div class="a" style="left:0;top:0;width:200px;height:200px">${LOGO('lg1')}</div>`);
  s.wm = rollBox(c, 0, 0, 1000, 150, `<span class="disp" style="font-size:130px">GlobalSpeak</span>`);
  s.tag = el(c, `<div class="a" style="left:0;right:0;top:700px;text-align:center;font-size:44px;font-weight:500;color:var(--muted)">${words('Book language classes with expert teachers.')}</div>`);
}, (s, b) => {
  const lg = s.logo, svg = lg.firstElementChild;
  // draw
  svg.querySelector('.ring1').style.strokeDashoffset = 1 - VP.eOut(ramp(.3, 2.2, x => x));
  svg.querySelector('.ring2').style.strokeDashoffset = 1 - VP.eOut(ramp(.8, 2.6, x => x));
  svg.querySelectorAll('.grid *').forEach((g, i) => g.style.strokeDashoffset = 1 - VP.eOut(ramp(2.6 + i * .2, 3.8 + i * .2, x => x)));
  const gk = sp(1.8, ...SPR.POP); svg.querySelector('.globe').setAttribute('transform', `scale(${gk})`);
  svg.querySelector('.bookL').setAttribute('transform', `scale(${sp(3.2, ...SPR.POP)},1)`); svg.querySelector('.bookR').setAttribute('transform', `scale(${sp(3.45, ...SPR.POP)},1)`);
  svg.querySelector('.arc').setAttribute('opacity', 1); svg.querySelector('.arc').style.transformOrigin = '100px 100px'; svg.querySelector('.arc').style.transform = `rotate(${-40 * (1 - sp(3.9, 1.6, .8))}deg) scale(${sp(3.9, 1.6, .8)})`;
  svg.querySelectorAll('.rd').forEach(d => d.setAttribute('r', 3 * sp(4.3, ...SPR.POP)));
  // layout: logo centred, then slides left to make room for the wordmark
  const slide = sp(4.8, 1.5, .85), size = lerp(380, 280, slide);
  const lx = lerp(W / 2 - size / 2, 470 - size / 2, slide), ly = 460 - size / 2;
  // zoom-through: scale about the globe centre until blue covers the frame
  const z = 1 + 60 * Math.pow(ramp(9.1, 10.1, x => x), 3);
  const gx = lx + size * .5, gy = ly + size * .46;
  lg.style.left = lx + 'px'; lg.style.top = ly + 'px'; lg.style.width = lg.style.height = size + 'px'; svg.setAttribute('width', size); svg.setAttribute('height', size);
  s.cam.style.transformOrigin = `${gx}px ${gy}px`; s.cam.style.transform = `scale(${z})`;
  s.wm.style.left = (lx + size + 40) + 'px'; s.wm.style.top = (ly + size / 2 - 75) + 'px'; rollK(s.wm, 5.1);
  s.tag.querySelectorAll('.mask>span').forEach((w, i) => { const k = sp(6.2 + i * .28, ...SPR.POP); w.style.transform = `translateY(${(1 - k) * 105}%)`; });
});

/* 2 · HOOK — kinetic words on globe blue (10–18) */
scene('hook', 10, 18.3, 'var(--blue)', 'none', (c, s) => {
  s.l = ['Every class.', 'Every teacher.', 'Every student.'].map(t => rollBox(c, 0, 420, W, 170, `<span class="disp" style="font-size:150px;color:#fff">${t}</span>`, 'text-align:center'));
  s.one = el(c, `<div class="a disp" style="left:0;right:0;top:400px;text-align:center;font-size:170px;color:#fff">${words('One place.')}<span class="rdot" style="display:inline-block;width:34px;height:34px;border-radius:50%;background:var(--red);margin-left:10px"></span></div>`);
}, (s, b) => {
  s.l.forEach((e, i) => rollK(e, 10.15 + i * 2, 12.15 + i * 2));
  s.one.querySelectorAll('.mask>span').forEach((w, i) => { const k = sp(16.1 + i * .3, ...SPR.POP); w.style.transform = `translateY(${(1 - k) * 105}%)`; });
  const rd = s.one.querySelector('.rdot'); rd.style.transform = `scale(${sp(16.9, ...SPR.POP)})`;
});

/* 3 · BROWSER — student home, cursor to "Book a class" (18–26) */
const WIN = R(240, 150, 1440, 944, 18), BTN = [240 + 720, 194 + 293];
scene('browser', 18, 26.6, 'var(--cream)', 'rise', (c, s) => {
  s.win = el(c, `<div class="card" style="border-radius:18px"><div class="win-bar"><i class="dot" style="left:18px;background:#FF5F57"></i><i class="dot" style="left:38px;background:#FEBC2E"></i><i class="dot" style="left:58px;background:#28C840"></i>
    <div style="position:absolute;left:50%;top:9px;transform:translateX(-50%);width:460px;height:26px;border-radius:8px;background:#E7E3DA;font-size:14px;color:#5F6675;display:flex;align-items:center;justify-content:center">GlobalSpeak Bookings</div></div>
    <img src="${IMG.home}" style="position:absolute;left:0;top:44px;width:1440px;height:900px"></div>`); place(s.win, WIN);
  s.cap = rollBox(s.hud, 240, 60, 1440, 70, `<span style="font-size:44px;font-weight:650">Students start here.</span>`);
}, (s, b) => {
  const k = sp(18, ...SPR.HEAVY); s.win.style.transform = `translateY(${(1 - k) * 160}px)`;
  rollK(s.cap, 18.8, 21.5);
  const z = track([[0, 1], [21.8, 1.5, 1.3, .9]]); VP.camera(s.cam, z, BTN[0], BTN[1]);
});

/* 4 · BOOKING — rebuilt booking flow, crisp at any zoom (26–46) */
const CARD = R(210, 200, 1500, 830, 28), CX = CARD[0], CY = CARD[1];
const SUBJ = [['Business English', '#1E4DD8'], ['IELTS Preparation', '#D32F2F'], ['Speaking Practice', '#DECB95'], ['Pronunciation', '#1A2540'], ['Grammar & Writing', '#1F9D55'], ['Travel English', '#7B61FF']];
const DAYS = ['Mon 13', 'Tue 14', 'Wed 15', 'Thu 16', 'Fri 17', 'Sat 18', 'Sun 19'], TIMES = ['09:00', '09:30', '10:00', '18:00', '18:30'];
const STATUS = ['PPABAUU', 'PBAAAUU', 'PAABAAU', 'UAAABAU', 'UABAAAU'];     // P past · B booked · A available · U unavailable
const PICK = [[0, 2], [3, 4]];                                             // (row, col) the cursor selects
const cellXY = (r, c) => [CX + 118 + c * 132, CY + 520 + r * 54];
scene('book', 25.6, 46.6, 'var(--cream)', 'grow', (c, s) => {
  s.card = el(c, `<div class="card" style="border-radius:28px"></div>`); place(s.card, CARD);
  const k = s.card;
  el(k, `<div class="a disp" style="left:48px;top:38px;font-size:36px">Schedule a Class</div>`);
  s.cred = el(k, `<div class="pill" style="right:48px;top:36px;height:46px;padding:0 20px;background:var(--cream2);font-size:18px;color:var(--navy)"><b class="n">6</b>&nbsp;credits remaining</div>`);
  s.steps = ['Select Class Type', 'Choose Teacher', 'Pick Slots'].map((t, i) => el(k, `<div class="a" style="left:${48 + i * 330}px;top:112px;display:flex;align-items:center;gap:12px;font-size:19px;font-weight:600"><b class="num" style="width:34px;height:34px;border-radius:50%;background:#E9E5DA;color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:16px">${i + 1}</b>${t}</div>`));
  el(k, `<div class="a" style="left:48px;right:48px;top:170px;height:1px;background:var(--border)"></div>`);
  s.chips = SUBJ.map(([n, col], i) => el(k, `<div class="chip" style="left:${48 + (i % 3) * 318}px;top:${196 + Math.floor(i / 3) * 78}px;width:302px;height:64px"><i style="background:${col}"></i>${n.replace('&', '&amp;')}<small>1 credit</small></div>`));
  s.teacher = el(k, `<div class="chip" style="left:48px;top:372px;width:620px;height:104px;border-radius:18px;gap:18px">
     <i style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#DECB95,#D32F2F);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:22px;font-style:normal">AR</i>
     <div><div style="font-size:22px;font-weight:700">Alex Rivera</div><div style="font-size:15px;color:var(--muted);font-weight:500;margin-top:4px">32 · Canadian · Business English · IELTS · Speaking</div></div><small class="sel">Select</small></div>`);
  s.dayh = DAYS.map((d, i) => el(k, `<div class="a" style="left:${118 + i * 132}px;top:486px;width:124px;text-align:center;font-size:15px;font-weight:600;color:var(--muted)">${d}</div>`));
  s.timeh = TIMES.map((t, r) => el(k, `<div class="a" style="left:48px;top:${520 + r * 54 + 12}px;font-size:15px;font-weight:600;color:var(--muted)">${t}</div>`));
  s.cells = []; STATUS.forEach((row, r) => [...row].forEach((st, cc) => { const lab = { P: 'Past', B: 'Booked', A: 'Available', U: '—' }[st];
    const sty = { P: 'background:#F1EEE6;color:#A3A7B0', B: 'background:#FFF4D6;color:#8A6D1E', A: 'background:#EEF3FF;color:#1E4DD8', U: 'background:#F6F4EF;color:#C9CBD1' }[st];
    s.cells.push({ r, c: cc, st, e: el(k, `<div class="cell" style="left:${118 + cc * 132}px;top:${520 + r * 54}px;width:124px;height:46px;${sty}">${lab}</div>`) }); }));
  // summary
  el(k, `<div class="a" style="left:1060px;top:196px;width:392px;height:600px;border-radius:20px;background:var(--cream2)"></div>`);
  el(k, `<div class="a disp" style="left:1090px;top:222px;font-size:26px">Your Booking</div>`);
  s.sum = [['Class Type', 'IELTS Preparation', 30.6], ['Teacher', 'Alex Rivera', 33.3]].map(([l, v, bk], i) => ({ bk, l: el(k, `<div class="a" style="left:1090px;top:${282 + i * 86}px;font-size:15px;color:var(--muted);font-weight:500">${l}</div>`), v: rollBox(k, 1090, 306 + i * 86, 340, 36, `<span style="font-size:22px;font-weight:650">${v}</span>`) }));
  el(k, `<div class="a" style="left:1090px;top:454px;font-size:15px;color:var(--muted);font-weight:500">Slots</div>`);
  s.slot = [['Wed 15 · 09:00', 36.4], ['Thu 16 · 18:00', 37.9]].map(([t, bk], i) => ({ bk, e: rollBox(k, 1090, 478 + i * 44, 340, 40, `<span style="display:inline-flex;align-items:center;gap:10px;font-size:19px;font-weight:600"><i style="width:10px;height:10px;border-radius:50%;background:var(--blue);display:inline-block"></i>${t}</span>`) }));
  s.btn = el(k, `<div class="pill" style="left:1090px;top:690px;width:332px;height:68px;background:#D9D6CE;color:#fff;font-size:20px;overflow:hidden"><div class="l0">Confirm 2 Bookings</div></div>`);
  s.note = rollBox(k, 1060, 770, 392, 30, `<span style="font-size:14px;color:var(--muted)">Auto-confirmed. Cancel up to 2 hours before class.</span>`, 'text-align:center');
  s.caps = [['Pick a class.', 27, 31.2], ['Pick a teacher.', 31.2, 34.3], ['Pick a time.', 34.3, 40.4], ['Booked. Instantly.', 40.4, 99]].map(([t, a, o]) => ({ a, o, e: rollBox(s.hud, 210, 88, 1500, 84, `<span class="disp" style="font-size:64px">${t}</span>`) }));
}, (s, b) => {
  s.caps.forEach(q => rollK(q.e, q.a, q.o));
  const active = b < 30.6 ? 0 : b < 33.3 ? 1 : 2;
  s.steps.forEach((e, i) => { const n = e.querySelector('.num'), on = i <= active || b >= 40.2; n.style.background = on ? 'var(--navy)' : '#E9E5DA'; n.style.color = on ? '#fff' : 'var(--navy)'; if (b >= 30.6 && i === 0 || b >= 33.3 && i === 1 || b >= 40.2 && i === 2) n.innerHTML = '&#10003;'; else n.textContent = i + 1; });
  s.chips.forEach((e, i) => { popK(e, 27.2 + i * .16); const sel = i === 1 && b >= 30.4; e.style.borderColor = sel ? 'var(--navy)' : 'var(--border)'; e.style.boxShadow = sel ? '0 0 0 2px var(--navy)' : 'none'; if (i === 1) e.style.transform += ` scale(${1 - .04 * Math.sin(clamp((b - 30.2) / .5) * Math.PI)})`; });
  popK(s.teacher, 31.4, SPR.POP, '0% 50%'); const tsel = b >= 33.1; s.teacher.style.borderColor = tsel ? 'var(--navy)' : 'var(--border)'; s.teacher.style.boxShadow = tsel ? '0 0 0 2px var(--navy)' : 'none'; s.teacher.querySelector('.sel').textContent = tsel ? 'Selected' : 'Select';
  [...s.dayh, ...s.timeh].forEach(e => { e.style.visibility = b >= 34 ? 'visible' : 'hidden'; });
  s.cells.forEach(q => { popK(q.e, 34.1 + (q.c + q.r) * .07, SPR.SNAP); const pi = PICK.findIndex(([r, c]) => r === q.r && c === q.c); if (pi >= 0 && b >= 36.2 + pi * 1.5) { q.e.style.background = 'var(--blue)'; q.e.style.color = '#fff'; q.e.textContent = 'Selected'; } });
  s.sum.forEach(q => rollK(q.v, q.bk)); s.slot.forEach(q => rollK(q.e, q.bk));
  // confirm → booked
  const ready = b >= 38, done = sp(40.2, ...SPR.SNAP);
  s.btn.style.background = done > .02 ? `rgb(${VP.mix([26, 37, 64], [31, 157, 85], clamp(done)).join(',')})` : ready ? 'var(--navy)' : '#D9D6CE';
  s.btn.querySelector('.l0').innerHTML = done > .5 ? '&#10003;&nbsp; 2 classes booked' : 'Confirm 2 Bookings';
  const press = b >= 40 && b < 40.6 ? 1 - .05 * Math.sin(clamp((b - 40) / .5) * Math.PI) : 1; s.btn.style.transform = `scale(${press})`;
  rollK(s.note, 40.8);
  s.cred.querySelector('.n').textContent = b < 40.4 ? 6 : Math.round(lerp(6, 4, eOut((b - 40.4) / .8)));
  // camera: follow the action
  const z = track([[0, 1], [30, 1.08, 1.2, .9], [33.8, 1.12, 1.2, .9], [39.4, 1.16, 1.2, .9], [42.5, 1, 1.2, .9]]);
  const f = track([[0, [960, 560]], [30, [640, 420], 1.2, .9], [33.8, [700, 720], 1.2, .9], [39.4, [1300, 820], 1.2, .9], [42.5, [960, 560], 1.2, .9]]);
  VP.camera(s.cam, z, f[0], f[1]);
});

/* 5 · CALENDAR + MEET (46–54) */
const CAL = R(260, 190, 1400, 820, 24), colX = c => CAL[0] + 110 + c * 180, rowY = h => CAL[1] + 120 + (h - 8) * 56;
scene('cal', 46, 54.6, 'var(--cream)', 'rise', (c, s) => {
  s.cap = rollBox(s.hud, 260, 86, 1400, 80, `<span class="disp" style="font-size:60px">On their calendar. With a Meet link.</span>`);
  s.win = el(c, `<div class="card"></div>`); place(s.win, CAL); const k = s.win;
  el(k, `<div class="a disp" style="left:40px;top:34px;font-size:32px">July 2026</div>`);
  s.sync = el(k, `<div class="pill" style="right:40px;top:30px;height:44px;padding:0 18px;background:#E8F6EE;color:var(--green);font-size:17px">&#10003;&nbsp; Synced with Google Calendar</div>`);
  DAYS.forEach((d, i) => el(k, `<div class="a" style="left:${110 + i * 180}px;top:92px;width:170px;text-align:center;font-size:16px;font-weight:600;color:${i === 2 || i === 3 ? 'var(--blue)' : 'var(--muted)'}">${d}</div>`));

  el(scr, `<div class="a" style="left:14px;right:14px;bottom:26px;height:58px;border-radius:29px;background:#F2EFE8;display:flex;align-items:center;padding:0 22px;font-size:17px;color:#9AA0AC">Message Alex…</div>`);
}, (s, b) => {
  s.cap.querySelectorAll('.mask>span').forEach((w, i) => { const k = sp(98.6 + i * .25, ...SPR.POP); w.style.transform = `translateY(${(1 - k) * 105}%)`; });
  const pk = sp(98, ...SPR.HEAVY); s.ph.style.transform = `translateY(${(1 - pk) * 500}px)`;
  s.b.forEach((e, i) => popK(e, [99.2, 100.2, 101.6, 103.8][i], SPR.POP, i === 2 ? '100% 100%' : '0% 100%'));
  popK(s.react, 102.6); const ty = b >= 102.9 && b < 103.8; s.typing.style.display = ty ? 'flex' : 'none';
  s.typing.querySelectorAll('i').forEach((d, i) => d.style.transform = `translateY(${-5 * Math.max(0, Math.sin(b * 8 - i * .9))}px)`);

/* 11 · CLOSE — roles → logo → CTA (106–116) */
scene('close', 106, 118, 'var(--cream)', 'iris', (c, s) => {
  s.roles = el(c, `<div class="a disp" style="left:0;right:0;top:430px;text-align:center;font-size:92px;white-space:nowrap">${words('Owner · Admin · Teacher · Student')}</div>`);
  s.sub = rollBox(c, 0, 580, W, 70, `<span style="font-size:40px;font-weight:500;color:var(--muted)">One platform for everyone in your school.</span>`, 'text-align:center');
  s.logo = el(c, `<div class="a" style="left:${W / 2 - 330}px;top:300px;width:240px;height:240px">${LOGO('lg2')}</div>`);
  s.wm = rollBox(c, W / 2 - 60, 330, 900, 110, `<span class="disp" style="font-size:92px">GlobalSpeak</span>`);
  s.wm2 = rollBox(c, W / 2 - 58, 440, 900, 60, `<span style="font-size:40px;font-weight:500;color:var(--muted)">Academy</span>`);
  s.cta = el(c, `<div class="pill" style="left:${W / 2 - 230}px;top:680px;width:460px;height:84px;background:var(--navy);color:#fff;font-size:28px">Book your first class &nbsp;&rarr;</div>`);
}, (s, b) => {
  const out = sp(109.4, ...SPR.SNAP);
  s.roles.querySelectorAll('.mask>span').forEach((w, i) => { const k = sp(106.6 + i * .22, ...SPR.POP); w.style.transform = `translateY(${((1 - k) - out) * 105}%)`; });
  rollK(s.sub, 107.8, 109.4);
  const svg = s.logo.firstElementChild; svg.setAttribute('width', 240); svg.setAttribute('height', 240);
  const lk = sp(109.8, 1.6, .7); svg.style.transform = `scale(${lk}) rotate(${(1 - lk) * -30}deg)`; svg.style.visibility = lk > .002 ? 'visible' : 'hidden';
  svg.querySelectorAll('[stroke-dasharray]').forEach(p => p.style.strokeDashoffset = 0); svg.querySelector('.globe').setAttribute('transform', 'scale(1)');
  rollK(s.wm, 110.4); rollK(s.wm2, 110.9); popK(s.cta, 111.8);
  const z = 1 + .03 * ramp(111, 118, x => x); VP.camera(s.cam, z, 960, 500);
});

/* ============ transitions (next scene covers previous; one spring) ============ */
const GROW = [826, 451, 267, 72, 36], f2 = v => (+v).toFixed(2), f4 = v => (+v).toFixed(4);   // never emit 1e-7 into CSS: it is silently ignored
function trans(s, b) {
  const k = s.in === 'none' ? 1 : sp(s.start, 1.5, .86); let tf = '', clip = '';
  switch (s.in) {
    case 'rise': tf = `translateY(${f2((1 - k) * H)}px)`; break;
    case 'push': tf = `translateX(${f2((1 - k) * W)}px)`; break;
    case 'zoom': tf = `scale(${f4(lerp(.72, 1, k))})`; clip = `inset(${f2((1 - k) * H / 2)}px ${f2((1 - k) * W / 2)}px round ${f2((1 - k) * 60)}px)`; break;
    case 'iris': clip = `circle(${(Math.hypot(W, H) / 2 * k).toFixed(1)}px at 50% 50%)`; break;
    case 'grow': { const r = GROW.map((v, i) => f2(lerp(v, [0, 0, W, H, 0][i], k))); clip = `inset(${r[1]}px ${W - r[0] - r[2]}px ${H - r[1] - r[3]}px ${r[0]}px round ${r[4]}px)`; break; }
  }
  const nx = S[S.indexOf(s) + 1]; if (nx && nx.in !== 'none' && b >= nx.start) { const kx = sp(nx.start, 1.5, .86);
    tf += { rise: ` translateY(${f2(-kx * H * .22)}px)`, push: ` translateX(${f2(-kx * W * .3)}px)`, zoom: ` scale(${f4(lerp(1, 1.15, kx))})`, iris: ` scale(${f4(lerp(1, .95, kx))})`, grow: '' }[nx.in] || ''; }
  s.root.style.transform = tf; s.root.style.clipPath = clip;
}

/* ============ cursor ============ */
const CK = [[0, 2100, 1300], [19.5, 2100, 1300], [21.6, 1150, 700], [22.4, BTN[0] + 20, BTN[1] + 10], [24.4, BTN[0] + 20, BTN[1] + 10], [25.4, BTN[0] + 20, BTN[1] + 10],
  [27, 1100, 900], [30, CX + 48 + 318 + 150, CY + 228], [30.8, CX + 48 + 318 + 150, CY + 228], [32.9, CX + 380, CY + 424], [33.6, CX + 380, CY + 424],
  [36, cellXY(0, 2)[0] + 60, cellXY(0, 2)[1] + 24], [36.6, cellXY(0, 2)[0] + 60, cellXY(0, 2)[1] + 24], [37.6, cellXY(3, 4)[0] + 60, cellXY(3, 4)[1] + 24], [38.2, cellXY(3, 4)[0] + 60, cellXY(3, 4)[1] + 24],
  [39.8, CX + 1256, CY + 724], [40.8, CX + 1256, CY + 724], [42.6, 2100, 1200], [69.3, 2100, 1200], [70, 960, 510], [71.6, 960, 510], [72.4, 960, 666], [73.4, 960, 666], [74.6, 2100, 1200],
  [94.2, 2100, 1300], [95.2, 1610, 1000], [96.4, 1610, 1000], [97.6, 2100, 1300], [118, 2100, 1300]];
const CLICKS = [24.3, 30.4, 33.1, 36.2, 37.7, 40.1, 70.2, 72.6, 95.4];
const camOf = b => { const s = S.find(q => b >= q.start && b < q.end && q.cam.style.transform); return s; };
function cursor(b) {
  let i = 0; while (i < CK.length - 2 && b >= CK[i + 1][0]) i++; const a = CK[i], c = CK[i + 1], e = ease((b - a[0]) / (c[0] - a[0] || 1));
  let x = lerp(a[1], c[1], e), y = lerp(a[2], c[2], e);
  // map through the active scene's camera so the cursor stays glued to UI while the camera moves
  const s = [...S].reverse().find(q => b >= q.start && b < q.end); if (s) { const m = s.cam.style.transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\) scale\(([\d.]+)\)/); if (m) { x = +m[1] + x * +m[3]; y = +m[2] + y * +m[3]; } }
  let sc = 1; CLICKS.forEach(k => { if (b >= k - .1 && b < k + .35) sc = Math.min(sc, 1 - .2 * Math.sin(clamp((b - k + .1) / .45) * Math.PI)); });
  $('#cursor').style.transform = `translate(${x}px,${y}px) scale(${sc})`;
}

/* ============ frame ============ */
const DUR = 118 * B;
function frame(t) {
  const b = VP.at(t);
  S.forEach(s => { const on = b >= s.start - .01 && b < s.end; s.root.style.display = on ? 'block' : 'none'; if (!on) return; trans(s, b); s.anim(s, b); });
  cursor(b);
}
function cues() {
  const c = [{ beat: 10, type: 'hit', gain: -16 }];
  S.forEach(s => { if (s.in !== 'none') c.push({ beat: s.start, type: s.in === 'zoom' || s.in === 'iris' || s.in === 'grow' ? 'swoosh-deep' : 'swoosh', gain: -20 }); });
  CLICKS.forEach(k => c.push({ beat: k, type: 'click', gain: -22 }));
  [40.3, 72.7].forEach(k => c.push({ beat: k, type: 'coin', gain: -20 }));
  c.push({ beat: 57.8, type: 'notify', gain: -18 }, { beat: 110.2, type: 'hit', gain: -15 });
  return c;
}
VP.boot({ seek: frame, dur: DUR, cues, fonts: ['700 100px Geist', '500 40px Geist'] });
window.SIZE = [W, H]; window.B = B;
</script></body></html>
